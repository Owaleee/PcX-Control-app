[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcx-agent"
version = "0.4.0"
description = "Agente do PcX Control: sensores do PC Windows para o celular, na rede local."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "psutil>=6.0",
  "websockets>=13",  # o Uvicorn precisa dele para servir WebSocket
  "qrcode[pil]>=7",  # QR de pareamento no terminal e na janela
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "Pillow>=10",
]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
  "nvidia-ml-py>=12; sys_platform == 'win32'",
  "pystray>=0.19; sys_platform == 'win32'",
  "Pillow>=10",
]
build = [
  "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
include = ["pcx_agent*"]

[tool.setuptools.package-data]
pcx_agent = ["assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["windows: testes que exigem Windows real"]

[tool.coverage.run]
source = ["pcx_agent"]
omit = ["pcx_agent/sensors/windows/*", "pcx_agent/tray/*", "pcx_agent/winsys/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"pcx_agent/api/*.py" = ["B008"]  # Depends(...) como valor padrao e o idioma do FastAPI
