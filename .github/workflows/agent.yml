name: agent

on:
  push:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]

defaults:
  run:
    working-directory: agent

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: pip install -e ".[dev]"
      - name: Instalar dependencias (Windows)
        if: runner.os == 'Windows'
        run: pip install -e ".[dev,windows]"
      - name: Lint
        run: ruff check .
      - name: Testes com cobertura (Linux)
        if: runner.os == 'Linux'
        run: pytest --cov=pcx_agent --cov-fail-under=80
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: pytest
